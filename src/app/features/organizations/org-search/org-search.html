<div class="px-6 py-8 pb-12 max-w-[1400px] mx-auto min-h-[80vh] flex flex-col items-center justify-center fade-in">
  
  <div class="w-full max-w-2xl bg-surface-container-lowest rounded-3xl border border-outline-variant shadow-xl overflow-hidden">
    <!-- Header -->
    <div class="p-8 pb-6 border-b border-outline-variant bg-[#002C4D] text-white flex items-start justify-between relative overflow-hidden">
      <!-- Decorative BG -->
      <div class="absolute -right-6 -bottom-10 w-48 h-48 bg-white/5 rounded-full blur-2xl pointer-events-none"></div>

      <div class="relative z-10">
        <h2 class="text-3xl font-extrabold font-headline mb-1">Search Organization</h2>
        <p class="text-sm font-medium text-white/70">Lookup an organization's dossier by its configured identifiers</p>
      </div>
      <button (click)="goBack()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors relative z-10">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>

    <!-- Content -->
    <div class="p-8 space-y-8">
      
      <!-- Lookup Method Toggle -->
      <div class="space-y-3">
        <label class="block text-xs font-bold text-outline uppercase tracking-widest">Lookup Method</label>
        <div class="grid grid-cols-2 gap-4">
          
          <label class="group relative flex cursor-pointer rounded-2xl border border-outline-variant bg-surface p-4 hover:bg-surface-container-low has-[:checked]:border-primary has-[:checked]:bg-primary-container/20 transition-all shadow-sm shrink-0">
            <input type="radio" name="searchMode" value="account" [(ngModel)]="searchMode" class="peer sr-only" />
            <div class="absolute right-4 top-4 text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
              <span class="material-symbols-outlined text-[20px]">check_circle</span>
            </div>
            <div class="flex flex-col gap-2">
              <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform">
                <span class="material-symbols-outlined text-[20px]">account_balance</span>
              </div>
              <div>
                <h4 class="font-bold text-on-surface text-base">Account No.</h4>
                <p class="text-xs text-on-surface-variant font-medium mt-0.5">Search via Settlement Details</p>
              </div>
            </div>
          </label>

          <label class="group relative flex cursor-pointer rounded-2xl border border-outline-variant bg-surface p-4 hover:bg-surface-container-low has-[:checked]:border-primary has-[:checked]:bg-primary-container/20 transition-all shadow-sm shrink-0">
            <input type="radio" name="searchMode" value="shortcode" [(ngModel)]="searchMode" class="peer sr-only" />
            <div class="absolute right-4 top-4 text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
              <span class="material-symbols-outlined text-[20px]">check_circle</span>
            </div>
            <div class="flex flex-col gap-2">
              <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform">
                <span class="material-symbols-outlined text-[20px]">tag</span>
              </div>
              <div>
                <h4 class="font-bold text-on-surface text-base">Org Shortcode</h4>
                <p class="text-xs text-on-surface-variant font-medium mt-0.5">Search via configured Shortcode</p>
              </div>
            </div>
          </label>

        </div>
      </div>

      <!-- Search Input -->
      <div class="space-y-3">
        <label class="block text-xs font-bold text-outline uppercase tracking-widest">Enter Identifier Value</label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
            <span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[24px]">search</span>
          </div>
          <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" 
            [placeholder]="searchMode === 'account' ? 'e.g., 1123456789' : 'e.g., 536921'" 
            class="block w-full pl-12 pr-4 py-4 bg-surface-container-low text-on-surface border border-outline-variant rounded-2xl text-lg font-medium focus:ring-2 focus:ring-primary focus:border-primary focus:bg-white transition-all outline-none shadow-sm" required>
        </div>
      </div>
      
    </div>

    <!-- Footer Action -->
    <div class="p-8 pt-6 border-t border-outline-variant bg-slate-50 flex items-center justify-end">
      <button (click)="onSearch()" [disabled]="!searchQuery.trim()" 
        class="px-8 py-3.5 bg-primary text-white font-bold rounded-xl shadow-md hover:shadow-lg hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 transition-all flex items-center gap-2 text-lg">
        Execute Search <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
      </button>
    </div>
  </div>

</div>

<div class="p-8 max-w-4xl mx-auto space-y-8">
  <div class="mb-8 flex items-center gap-4">
    <button routerLink="/users" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors text-outline">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div>
      <h2 class="text-3xl font-extrabold font-headline text-on-surface tracking-tight">Add New Portal User</h2>
      <p class="text-on-surface-variant mt-1 text-sm">Create a new user profile and assign role-based access.</p>
    </div>
  </div>

  <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant/30 overflow-hidden">
    <div class="bg-surface-container-low/30 px-8 py-5 border-b border-surface-variant/30">
      <h3 class="font-bold text-lg text-on-surface flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">person</span> User Information
      </h3>
    </div>
    
    <div class="p-8">
      <form class="space-y-8">
        <!-- Personal Details -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-sm font-bold text-on-surface-variant">First Name</label>
            <input type="text" class="w-full bg-surface border border-outline-variant/60 rounded-lg px-4 py-2.5 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/50" placeholder="e.g. Jane" />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-bold text-on-surface-variant">Last Name</label>
            <input type="text" class="w-full bg-surface border border-outline-variant/60 rounded-lg px-4 py-2.5 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/50" placeholder="e.g. Doe" />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-bold text-on-surface-variant">Email Address</label>
            <input type="email" class="w-full bg-surface border border-outline-variant/60 rounded-lg px-4 py-2.5 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/50" placeholder="jane.doe@company.com" />
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-bold text-on-surface-variant">Phone Number</label>
            <input type="tel" class="w-full bg-surface border border-outline-variant/60 rounded-lg px-4 py-2.5 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/50" placeholder="+1 (555) 000-0000" />
          </div>
        </div>

        <div class="h-px w-full bg-surface-variant/40"></div>

        <!-- Role Configuration -->
        <div>
          <h4 class="font-bold text-on-surface mb-4">Role Configuration</h4>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Role 1 -->
            <label class="relative flex cursor-pointer rounded-lg border bg-surface-container-low/50 p-4 hover:bg-surface-container-low has-[:checked]:border-primary has-[:checked]:bg-primary/5 transition-all">
              <input type="radio" name="role" class="peer sr-only" value="branch_maker" />
              <div class="flex flex-col gap-1">
                <div class="flex items-center gap-2">
                  <div class="font-bold text-sm text-on-surface peer-checked:text-primary">BRANCH_MAKER</div>
                  <span class="material-symbols-outlined text-[18px] text-primary opacity-0 peer-checked:opacity-100 transition-opacity">check_circle</span>
                </div>
                <p class="text-xs text-on-surface-variant">Can create and modify transactions at the branch level. Cannot verify.</p>
              </div>
            </label>

            <!-- Role 2 -->
            <label class="relative flex cursor-pointer rounded-lg border bg-surface-container-low/50 p-4 hover:bg-surface-container-low has-[:checked]:border-primary has-[:checked]:bg-primary/5 transition-all">
              <input type="radio" name="role" class="peer sr-only" value="branch_checker" />
              <div class="flex flex-col gap-1">
                <div class="flex items-center gap-2">
                  <div class="font-bold text-sm text-on-surface peer-checked:text-primary">BRANCH_CHECKER</div>
                  <span class="material-symbols-outlined text-[18px] text-primary opacity-0 peer-checked:opacity-100 transition-opacity">check_circle</span>
                </div>
                <p class="text-xs text-on-surface-variant">Authorizes branch transactions. Cannot create them.</p>
              </div>
            </label>
            
            <!-- Role 3 -->
            <label class="relative flex cursor-pointer rounded-lg border bg-surface-container-low/50 p-4 hover:bg-surface-container-low has-[:checked]:border-primary has-[:checked]:bg-primary/5 transition-all">
              <input type="radio" name="role" class="peer sr-only" value="system_admin" />
              <div class="flex flex-col gap-1">
                <div class="flex items-center gap-2">
                  <div class="font-bold text-sm text-on-surface peer-checked:text-primary">SYSTEM_ADMIN</div>
                  <span class="material-symbols-outlined text-[18px] text-primary opacity-0 peer-checked:opacity-100 transition-opacity">check_circle</span>
                </div>
                <p class="text-xs text-on-surface-variant">Full system access including user management.</p>
              </div>
            </label>
          </div>
        </div>

        <div class="pt-6 border-t border-surface-variant/30 flex justify-end gap-3">
          <button type="button" routerLink="/users" class="px-6 py-2.5 font-bold text-on-surface-variant hover:bg-surface-container rounded-lg transition-colors">Cancel</button>
          <button type="button" class="px-8 py-2.5 bg-primary text-white font-bold rounded-lg shadow-sm shadow-primary/20 hover:bg-primary-container transition-all flex items-center gap-2">
            <span class="material-symbols-outlined text-[20px]">send</span> Submit Request
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
